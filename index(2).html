*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.45}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.45}button:focus-visible,summary:focus-visible{outline:3px solid #7b43ab;outline-offset:4px}svg{display:block}.icon{height:22px;width:22px;flex:none}.toolbar{background:var(--white);border-bottom:1px solid var(--line)}.bar,.layout{width:min(1340px,calc(100% - 48px));margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;min-height:72px;gap:12px;padding:8px 0}.brand{display:flex;gap:12px;align-items:center;font-weight:900;font-size:1.3rem;white-space:nowrap}.mark{display:grid;place-items:center;border-radius:14px;background:var(--green);color:white;width:42px;height:42px}.tools,.actions,.meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.util,.secondary,.primary,.light{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 15px;border:1px solid var(--line);border-radius:13px;background:white;font-weight:800;transition:transform .18s,background .18s}.util:hover,.secondary:hover,.light:hover{background:#ecf7ee}.primary{background:var(--green);color:white;border-color:var(--green);box-shadow:0 4px 0 #0d4939}.primary:hover{background:#084f3b}.light{background:var(--mint);border-color:#b7decb}.util:active,.secondary:active,.primary:active,.light:active,.tile:active,.choice:active{transform:translateY(2px)}

.stage{overflow:hidden}.stagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 27px 0}.meta{font-weight:800;color:var(--green)}.chip{background:#edf6ec;padding:5px 11px;border-radius:100px}.progress{height:8px;background:#ebece0;margin:14px 27px 0;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#3f9f7e;transition:width .3s;border-radius:9px}.timer{font-variant-numeric:tabular-nums}.screen{padding:22px 27px 26px;animation:arrive .24s ease-out}.screen h1{font-size:clamp(2rem,5.2vw,4.2rem);letter-spacing:-.045em;line-height:1.04;margin:0 0 9px}.screen h2{font-size:clamp(1.25rem,3vw,2rem);line-height:1.15;margin:0 0 8px}.intro{font-size:clamp(1rem,2vw,1.24rem);margin:0 0 19px;color:var(--muted)}.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:14px 27px 18px}.notes{margin-top:14px;border:1px solid var(--line);border-radius:15px;background:#fffdf8;padding:10px 16px;color:#31534b}.notes summary{cursor:pointer;font-weight:800;padding:6px 0}.notes p{margin:7px 0 8px}.notes p+p{margin-top:9px}.hero{display:grid;grid-template-columns:1.15fr .85fr;min-height:365px;background:#d6f0df;border-radius:22px;overflow:hidden}.hero-copy{padding:clamp(19px,4vw,42px);align-self:center;position:relative;z-index:1}.hero .kicker{font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--green);margin:0 0 12px}.hero .hello{font-size:1.35rem;font-weight:900;margin:15px 0 4px}.hero .heroart{width:100%;height:100%;min-height:220px;max-height:400px;align-self:end}.hero-tip{display:inline-block;margin:13px 0 0;border-radius:11px;padding:8px 12px;background:#fff8dc;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile,.choice{border:2px solid transparent;border-radius:18px;background:var(--tint,#f3f6ec);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;min-width:0;transition:transform .18s,border-color .18s,box-shadow .18s;text-align:center}.tile:hover,.choice:hover{border-color:var(--green);box-shadow:0 4px 0 #1e67452b}.tile .art,.choice .art{width:min(100%,150px);height:auto;aspect-ratio:6/5}.tile strong,.choice strong{font-size:clamp(1.1rem,2.7vw,1.85rem);line-height:1.2}.tile small{color:var(--muted);font-size:1rem}.tile .icon{margin-top:8px}.tile.playing{border-color:var(--green);animation:pop .25s ease-out}@keyframes pop{50%{transform:translateY(-4px)}}.panel{padding:20px;border-radius:18px;background:#f4f6ec;margin:12px 0}.prompt{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.prompt .art{width:min(185px,65%);height:auto}.big{font-size:clamp(1.9rem,5vw,3.4rem);font-weight:900;line-height:1.14}.feedback{font-weight:850;min-height:1.6em;margin:12px 0 8px;color:#245c4c}.feedback.bad{color:#931e39}.choice.good{border-color:#267658;background:#c8f0da;opacity:1}.choice.wrong{border-color:#ad3e57;background:#ffebee;opacity:1}.round-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:10px}.round-row .feedback{flex:1}.cue{min-height:230px;display:grid;align-content:center;justify-items:center;text-align:center}.cue p{margin:8px 0 0}.cue .art{width:145px;height:auto}.build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;align-items:center;border:2px dashed #8fa89b;border-radius:16px;margin:13px 0;background:#f4f8f0;padding:7px}.tokens{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.word{font-size:clamp(1.25rem,4vw,2rem);padding:7px 18px}.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.speech{background:#e6f4ea;border-radius:17px;padding:17px}.speech:nth-child(2){background:#eee5fb}.speech b{display:block;font-size:clamp(1.3rem,3.4vw,2.35rem);margin:4px 0}.exit{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exit .panel{margin:0}.exit .prompt{display:grid;grid-template-columns:1fr 1fr;gap:6px}.exit .prompt .art{width:100%;max-width:140px;margin:auto}.exit p{margin:7px 0}.answers[hidden]{display:none}.complete{display:grid;text-align:center;justify-items:center;align-content:center;min-height:320px;background:#d7f0e2;border-radius:22px;padding:26px}.complete .art{width:145px;height:auto}.caption{color:var(--muted);margin:6px 0}.hint{margin-top:12px;padding:8px 12px;border-radius:12px;background:#fff1c6}.round-label{font-weight:bold;color:var(--muted);margin:0 0 6px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

<script>
"use strict";
const lessons = [
  ["Разминка",4,"Поздоровайтесь <span lang='en'>Hello, everyone!</span> Дети машут рукой и отвечают <span lang='en'>Hello!</span> Предложите угадать по иллюстрации, чему посвящён урок. Дети могут отвечать по-русски. Покажите бег на месте маленькими шагами или изобразите его руками. Попросите повторить <span lang='en'>Let’s move!</span>"],
  ["Слова и картинки",7,"Откройте карточки по одной. Сначала дети слушают и повторяют слово хором, затем показывают движение руками. Пройдите карточки второй раз в другом порядке. В конце покажите картинку и предложите назвать слово самостоятельно. <span lang='en'>Swim</span> связано с <span lang='en'>swimming</span> на фото, а <span lang='en'>dance</span> помогает объяснить <span lang='en'>Zumba</span>."],
  ["Движение",6,"Первый круг пройдите с открытыми подсказками. Показывайте движения у парт, их можно выполнять сидя. Прыжок обозначьте поднятием рук. На <span lang='en'>Freeze!</span> дети замирают. После пробного круга выключите подсказки и предложите детям реагировать на звук. Можно читать команды самим. Посередине сделайте короткую паузу на воду."],
  ["На слух",6,"В каждом раунде включите запись, дайте классу 3–5 секунд подумать и попросите всех показать пальцами номер картинки. Каждый раз приглашайте другого ученика нажать ответ на доске. После проверки попросите класс повторить слово."],
  ["Собери фразу",6,"Сначала покажите, как сказать <span lang='en'>I can swim.</span> Объясните, что <span lang='en'>I can</span> означает «я умею». Пусть сначала весь класс произнесёт фразу, затем один ученик соберёт её на экране. После ответа класс повторяет её ещё раз. Для подсказки покажите на первые два слова образца."],
  ["Работа в парах",7,"Покажите диалог с одним учеником, затем дайте парам по две попытки на каждую роль. Ученик A говорит <span lang='en'>I can …</span> и показывает движение. Ученик B отвечает <span lang='en'>Me too!</span> и повторяет движение. Затем они меняются. В конце пригласите 2–3 пары показать диалог классу."],
  ["Угадай движение",6,"Каждый раз выбирайте нового ведущего. Пока остальные закрывают глаза, ведущий смотрит секретное слово. Спрячьте карточку перед тем, как класс откроет глаза. Ребёнок показывает движение, класс угадывает по-английски и повторяет <span lang='en'>I can …</span> после открытия ответа."],
  ["Билет на выход",3,"Первые две минуты дети записывают два слова и одну фразу самостоятельно. Затем откройте ответы и коротко проверьте. Быстрая шкала — 1 балл за каждое слово и 1 балл за понятную фразу <span lang='en'>I can + действие</span>. Примите любую из четырёх изученных фраз. Если ребёнку пока сложно писать, можно проверить устно."]
];

    state.chosen.push(token);
    state.checked = false;
    const nextToken = builds[state.buildRound][1].find(word => !state.chosen.includes(word));
    refreshActivity(nextToken ? `[data-token="${nextToken}"]` : '[data-action="check-build"]');
  } else if (remove) {
    state.chosen = state.chosen.filter(word => word !== remove);
    state.checked = false;
    refreshActivity(`[data-token="${remove}"]`);
  } else if (action) actions[action]();
});
render();
</script>
</body>
</html>
